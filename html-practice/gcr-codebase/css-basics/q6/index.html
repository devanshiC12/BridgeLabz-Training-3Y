<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="page-title">Gallery</h1>

  <section class="gallery">
    <figure class="photo">
      <img src="https://picsum.photos/id/1015/400/300" alt="Mountain river">
      <figcaption>Mountain River</figcaption>
    </figure>
    <figure class="photo">
      <img src="https://picsum.photos/id/1018/400/300" alt="Valley view">
      <figcaption>Valley View</figcaption>
    </figure>
    <figure class="photo">
      <img src="https://picsum.photos/id/1025/400/300" alt="Dog portrait">
      <figcaption>Good Boy</figcaption>
    </figure>
    <figure class="photo">
      <img src="https://picsum.photos/id/1035/400/300" alt="Forest path">
      <figcaption>Forest Path</figcaption>
    </figure>
    <figure class="photo">
      <img src="https://picsum.photos/id/1043/400/300" alt="Desert dunes">
      <figcaption>Desert Dunes</figcaption>
    </figure>
    <figure class="photo">
      <img src="https://picsum.photos/id/1050/400/300" alt="Old library">
      <figcaption>Old Library</figcaption>
    </figure>
  </section>

</body>
</html>
