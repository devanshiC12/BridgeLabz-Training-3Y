<!DOCTYPE html>
<html lang="en">
<head>

    <!-- title: sets the text shown on the browser tab -->
    <title>Q20 - Complete Head Section</title>

    <!-- meta charset: defines the character encoding of the document -->
    <meta charset="UTF-8">

    <!-- meta description: gives search engines a summary of the page -->
    <meta name="description" content="A demo page showing all important head elements.">

    <!-- meta author: states who created the page -->
    <meta name="author" content="Devanshi Chauhan">

    <!-- base: sets the default base URL/target for all relative links on this page -->
    <base href="https://example.com/">

    <!-- link: connects an external resource, here a favicon icon -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- style: reserved for internal CSS rules (left empty per HTML-only rule) -->
    <style>
    </style>

    <!-- script: reserved for internal JavaScript code (left empty per HTML-only rule) -->
    <script>
    </script>

</head>
<body>

    <h1>Head Section Demonstration</h1>
    <p>This page shows the title, meta tags, base, link, style, and script elements inside the head section.</p>

</body>
</html>
