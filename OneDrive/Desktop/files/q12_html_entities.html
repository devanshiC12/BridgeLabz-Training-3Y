<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Question 12: Displaying reserved characters using HTML entities -->
    <meta charset="UTF-8">
    <title>Q12 - HTML Entities</title>
</head>
<body>

    <h1>HTML Entity Examples</h1>

    <!-- &lt; = <, &gt; = >, &amp; = &, &quot; = ", &apos; = ' -->
    <p>
        Less than: &lt; <br>
        Greater than: &gt; <br>
        Ampersand: &amp; <br>
        Double quote: &quot; <br>
        Single quote: &apos;
    </p>

    <!-- Special symbols: copyright, trademark, registered -->
    <p>
        Copyright: &copy; <br>
        Trademark: &trade; <br>
        Registered: &reg;
    </p>

</body>
</html>
