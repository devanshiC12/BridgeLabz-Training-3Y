<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Question 7: Login Form with CSRF token -->
    <meta charset="UTF-8">
    <title>Q7 - Login Form</title>
</head>
<body>

    <h1>Login</h1>

    <form method="post" action="#">

        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <!--
            A CSRF (Cross-Site Request Forgery) token is a secret, unique
            value generated by the server and stored in a hidden field.
            When the form is submitted, the server checks that this token
            matches the one it issued. This proves the request truly came
            from the user's own form and not from a malicious site tricking
            the browser into submitting a forged request.
        -->
        <input type="hidden" name="csrf_token" value="a1b2c3d4e5f6dummy">

        <input type="submit" value="Login">

    </form>

</body>
</html>
