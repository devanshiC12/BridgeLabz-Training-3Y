<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Question 1: Embed a YouTube video using an iframe -->
    <meta charset="UTF-8">
    <title>Q1 - YouTube Video Embed</title>
</head>
<body>

    <h1>My Favorite YouTube Video</h1>

    <!--
        The iframe below embeds a YouTube video.
        Width and height are set in PERCENTAGE (not pixels)
        so the video resizes automatically with the browser window.
    -->
    <iframe
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        width="80%"
        height="60%"
        title="YouTube video player"
        allowfullscreen>
    </iframe>

</body>
</html>
