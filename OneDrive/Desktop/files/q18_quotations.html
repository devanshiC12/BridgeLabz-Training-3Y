<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Question 18: Long and short quotations -->
    <meta charset="UTF-8">
    <title>Q18 - Quotations</title>
</head>
<body>

    <h1>Quotation Examples</h1>

    <!-- blockquote is used for a long, standalone quotation -->
    <blockquote>
        Education is the most powerful weapon which you can use to
        change the world, and it &amp; hard work always go together.
    </blockquote>

    <!-- q is used for a short inline quotation within a sentence -->
    <p>
        My teacher always says, <q>practice makes a student perfect</q>,
        and I try to remember that every day.
    </p>

</body>
</html>
