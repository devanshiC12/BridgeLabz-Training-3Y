<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Question 14: Embedding an external website using iframe -->
    <meta charset="UTF-8">
    <title>Q14 - External Website Embed</title>
</head>
<body>

    <h1>Embedded Website</h1>

    <!-- Wikipedia's homepage is used here as an example external site -->
    <iframe
        src="https://www.wikipedia.org"
        title="Wikipedia Website"
        width="600"
        height="400">
    </iframe>

    <p>Some websites may not allow embedding for security reasons.</p>

</body>
</html>
