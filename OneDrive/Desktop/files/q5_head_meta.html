<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Question 5: Complete head section with important meta tags -->

    <!-- Specifies character encoding so special characters display correctly -->
    <meta charset="UTF-8">

    <!-- Identifies the author of the page -->
    <meta name="author" content="Devanshi Chauhan">

    <!-- Makes the page responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Q5 - Head Section Demo</title>
</head>
<body>

    <h1>UTF-8 Encoding Test</h1>

    <!-- Paragraph containing English, Hindi, and Japanese text -->
    <p>
        English: Welcome to my website.<br>
        Hindi: मेरी वेबसाइट पर आपका स्वागत है।<br>
        Japanese: 私のウェブサイトへようこそ。
    </p>

</body>
</html>
