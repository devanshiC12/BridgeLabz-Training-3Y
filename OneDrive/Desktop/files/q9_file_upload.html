<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Question 9: File Upload Form restricted to jpg/png -->
    <meta charset="UTF-8">
    <title>Q9 - File Upload Form</title>
</head>
<body>

    <h1>Upload Your Photo</h1>

    <form method="post" action="#" enctype="multipart/form-data">

        <label for="photo">Choose an image:</label><br>
        <!-- The accept attribute restricts the file picker to only
             .jpg and .png image files -->
        <input type="file" id="photo" name="photo" accept=".jpg,.png"><br><br>

        <input type="submit" value="Upload">

    </form>

    <p>Note: Only .jpg and .png image files are allowed for upload.</p>

</body>
</html>
