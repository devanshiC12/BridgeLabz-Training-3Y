<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Combined Layout</title>
<link rel="stylesheet" href="q10.css">
</head>
<body>
<header class="site-header">
  <div class="logo">MyLogo</div>
  <nav>
    <a href="#">Home</a>
    <a href="#">Blog</a>
    <a href="#">Contact</a>
  </nav>
</header>

<main class="layout">
  <article class="article">
    <h1 class="fade-title">Welcome to the Article</h1>
    <div class="article-boxes">
      <div class="box">Intro</div>
      <div class="box">Details</div>
      <div class="box">Summary</div>
    </div>
  </article>
  <aside class="sidebar">
    <h3>Sidebar</h3>
    <p>Links and widgets go here.</p>
  </aside>
</main>

<footer class="site-footer">
  <p>&copy; 2026 My Website. All rights reserved.</p>
</footer>
</body>
</html>
