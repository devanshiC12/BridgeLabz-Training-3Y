<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Q5 - Styled Button Collection</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f4f6f8;
}

header, footer {
  text-align: center;
  padding: 16px;
  background: #2c3e50;
  color: #fff;
}

/* Flexbox row for consistent spacing */
.btn-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
  padding: 60px 20px;
}

.btn {
  padding: 12px 24px;
  font-size: 1rem;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.25s ease-in-out;
  box-shadow: 0 3px 6px rgba(0,0,0,0.15);
}

/* Primary button */
.primary {
  background: #2980b9;
  color: #fff;
  border: none;
}
.primary:hover {
  background: #1f6391;
}
.primary:active {
  transform: scale(0.96);
}

/* Secondary button */
.secondary {
  background: #95a5a6;
  color: #fff;
  border: none;
}
.secondary:hover {
  background: #7f8c8d;
}
.secondary:active {
  transform: scale(0.96);
}

/* Outline button */
.outline {
  background: transparent;
  color: #2980b9;
  border: 2px solid #2980b9;
}
.outline:hover {
  background: #2980b9;
  color: #fff;
}

/* Focus state - visible ring for accessibility */
.btn:focus {
  outline: 3px solid #f39c12;
  outline-offset: 2px;
}

/* Disabled state */
.btn:disabled {
  background: #bdc3c7;
  color: #7f8c8d;
  cursor: not-allowed;
  box-shadow: none;
}
</style>
</head>
<body>
  <header>
    <h1>Styled Button Collection</h1>
  </header>

  <main class="btn-row">
    <button class="btn primary">Primary</button>
    <button class="btn secondary">Secondary</button>
    <button class="btn outline">Outline</button>
    <button class="btn primary" disabled>Disabled</button>
  </main>

  <footer>
    <p>&copy; 2026 Button Collection Assignment</p>
  </footer>
</body>
</html>
