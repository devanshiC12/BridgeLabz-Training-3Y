<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Q6 - CSS Animation Demo</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f4f6f8;
}

header, footer {
  text-align: center;
  padding: 16px;
  background: #2c3e50;
  color: #fff;
}

/* Center animations vertically and horizontally */
.anim-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 50px;
  min-height: 70vh;
}

/* Moving box: left-right loop */
.moving-box {
  width: 60px;
  height: 60px;
  background: #e74c3c;
  border-radius: 8px;
  animation: moveBox 2s ease-in-out infinite alternate;
}

@keyframes moveBox {
  from { transform: translateX(-100px); }
  to { transform: translateX(100px); }
}

/* Bouncing ball */
.bouncing-ball {
  width: 50px;
  height: 50px;
  background: #27ae60;
  border-radius: 50%;
  animation: bounce 1s ease-in-out infinite;
  animation-delay: 0.5s;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-60px); }
}

/* Color-changing text */
.color-text {
  font-size: 1.6rem;
  font-weight: bold;
  animation: colorChange 3s ease-in-out infinite;
  animation-iteration-count: infinite;
  animation-direction: alternate;
}

@keyframes colorChange {
  0%   { color: #e74c3c; }
  33%  { color: #2980b9; }
  66%  { color: #27ae60; }
  100% { color: #8e44ad; }
}
</style>
</head>
<body>
  <header>
    <h1>CSS Animation Demonstration</h1>
  </header>

  <main class="anim-wrap">
    <div class="moving-box"></div>
    <div class="bouncing-ball"></div>
    <p class="color-text">Color Changing Text</p>
  </main>

  <footer>
    <p>&copy; 2026 Animation Assignment</p>
  </footer>
</body>
</html>
