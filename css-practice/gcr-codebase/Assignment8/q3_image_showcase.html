<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Q3 - Image Showcase</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f4f6f8;
}

header, footer {
  text-align: center;
  padding: 16px;
  background: #2c3e50;
  color: #fff;
}

/* Grid layout for 6 images, responsive */
.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  padding: 30px;
}

.gallery-item {
  margin: 0;
  text-align: center;
}

.img-wrap {
  position: relative;
  overflow: hidden;
  border-radius: 10px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.2);
}

.img-wrap img {
  display: block;
  width: 100%;
  height: 200px;
  object-fit: cover;
  transition: transform 0.3s ease-in-out;
}

/* Overlay darkens on hover */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0);
  transition: background 0.3s ease-in-out;
}

.img-wrap:hover img {
  transform: scale(1.1);
}
.img-wrap:hover .overlay {
  background: rgba(0,0,0,0.35);
}

figcaption {
  margin-top: 8px;
  font-weight: bold;
  color: #2c3e50;
}

/* Responsive: single column below 700px */
@media (max-width: 700px) {
  .gallery {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>
  <header>
    <h1>Image Showcase Gallery</h1>
  </header>

  <main class="gallery">
    <figure class="gallery-item">
      <div class="img-wrap">
        <img src="https://picsum.photos/id/1015/400/300" alt="Mountain river">
        <div class="overlay"></div>
      </div>
      <figcaption>Mountain River</figcaption>
    </figure>

    <figure class="gallery-item">
      <div class="img-wrap">
        <img src="https://picsum.photos/id/1016/400/300" alt="Canyon">
        <div class="overlay"></div>
      </div>
      <figcaption>Canyon View</figcaption>
    </figure>

    <figure class="gallery-item">
      <div class="img-wrap">
        <img src="https://picsum.photos/id/1018/400/300" alt="Lake">
        <div class="overlay"></div>
      </div>
      <figcaption>Calm Lake</figcaption>
    </figure>

    <figure class="gallery-item">
      <div class="img-wrap">
        <img src="https://picsum.photos/id/1025/400/300" alt="Dog">
        <div class="overlay"></div>
      </div>
      <figcaption>Happy Dog</figcaption>
    </figure>

    <figure class="gallery-item">
      <div class="img-wrap">
        <img src="https://picsum.photos/id/1035/400/300" alt="Forest road">
        <div class="overlay"></div>
      </div>
      <figcaption>Forest Road</figcaption>
    </figure>

    <figure class="gallery-item">
      <div class="img-wrap">
        <img src="https://picsum.photos/id/1043/400/300" alt="Beach">
        <div class="overlay"></div>
      </div>
      <figcaption>Sunny Beach</figcaption>
    </figure>
  </main>

  <footer>
    <p>&copy; 2026 Image Showcase Assignment</p>
  </footer>
</body>
</html>
