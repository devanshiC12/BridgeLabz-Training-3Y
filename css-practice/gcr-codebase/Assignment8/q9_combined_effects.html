<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Q9 - Combined Effects Demo</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f4f6f8;
}

header, footer {
  text-align: center;
  padding: 16px;
  background: #2c3e50;
  color: #fff;
}

/* Flexbox distributes examples evenly */
.effects-row {
  display: flex;
  justify-content: space-evenly;
  align-items: center;
  flex-wrap: wrap;
  gap: 20px;
  padding: 60px 20px;
}

.fx-btn {
  padding: 14px 26px;
  border: none;
  border-radius: 10px;
  color: #fff;
  font-size: 1rem;
  cursor: pointer;
  box-shadow: 0 3px 6px rgba(0,0,0,0.2);
  transition: transform 0.3s ease-in-out, background 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
}

/* Combined pseudo-class + transform + transition on hover */
.fx-btn:hover {
  transform: scale(1.15);
  box-shadow: 0 6px 14px rgba(0,0,0,0.3);
}

.fx-btn:active {
  transform: scale(0.95);
}

.blue { background: #2980b9; }
.blue:hover { background: #1f6391; }

.green { background: #27ae60; }
.green:hover { background: #1e8449; }

.orange { background: #e67e22; }
.orange:hover { background: #ca6f1e; }

.purple { background: #8e44ad; }
.purple:hover { background: #703688; }
</style>
</head>
<body>
  <header>
    <h1>Combined Effects Demonstration</h1>
  </header>

  <main class="effects-row">
    <button class="fx-btn blue">Grow &amp; Glow</button>
    <button class="fx-btn green">Hover Me</button>
    <button class="fx-btn orange">Try Me</button>
    <button class="fx-btn purple">Click Me</button>
  </main>

  <footer>
    <p>&copy; 2026 Combined Effects Assignment</p>
  </footer>
</body>
</html>
