<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Transformations Showcase</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>CSS Transformations Showcase</h1></header>

  <main class="box-row">
    <div class="item">
      <div class="box rotate-box">Rotate</div>
      <p class="label">rotate(45deg) on hover</p>
    </div>
    <div class="item">
      <div class="box scale-box">Scale</div>
      <p class="label">scale(1.3) on hover</p>
    </div>
    <div class="item">
      <div class="box translate-box">Translate</div>
      <p class="label">translateY(-20px) on hover</p>
    </div>
    <div class="item">
      <div class="box skew-box">Skew</div>
      <p class="label">skew(15deg) on hover</p>
    </div>
  </main>

  <footer><p>Assignment 7 - Question 6</p></footer>
</body>
</html>
