<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Borders &amp; Padding Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Borders & Padding Demonstration</h1>
  </header>

  <main>
    <section class="box-row">
      <div class="box solid">Solid Border</div>
      <div class="box dashed">Dashed Border</div>
      <div class="box double">Double Border</div>
      <div class="box groove">Groove Border</div>
    </section>

    <section class="box-row">
      <div class="box round-sm">Small Radius</div>
      <div class="box round-md">Medium Radius</div>
      <div class="box round-lg">Large Radius</div>
      <div class="box round-circle">Circle</div>
    </section>

    <section class="box-row">
      <div class="box pad-sm">Padding 8px</div>
      <div class="box pad-md">Padding 20px</div>
      <div class="box pad-lg">Padding 40px</div>
    </section>
  </main>

  <footer>
    <p>Assignment 7 - Question 1</p>
  </footer>
</body>
</html>
