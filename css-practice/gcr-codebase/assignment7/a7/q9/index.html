<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Outline &amp; Focus Styling Form</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Outline &amp; Focus Styling Form</h1></header>

  <main>
    <form>
      <label for="name">Name</label>
      <input type="text" id="name" class="solid-outline" placeholder="Solid outline on focus">

      <label for="email">Email</label>
      <input type="email" id="email" class="dashed-outline" placeholder="Dashed outline on focus">

      <label for="message">Message</label>
      <textarea id="message" class="dotted-outline" rows="4" placeholder="Dotted outline on focus"></textarea>

      <button type="submit">Submit</button>
    </form>
  </main>

  <footer><p>Assignment 7 - Question 9</p></footer>
</body>
</html>
