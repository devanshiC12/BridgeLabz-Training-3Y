<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Q8 Custom Dropdown</title>
<link rel="stylesheet" href="base.css">
<style>
  #dropdown { position: relative; display: inline-block; }
  #dropdownBtn { min-width: 160px; text-align: left; }
  #optionList { display: none; position: absolute; top: 100%; left: 0; right: 0; margin: 2px 0 0; padding: 0;
    list-style: none; background: #fff; border: 1px solid #888; border-radius: 6px; }
  #optionList.open { display: block; }
  #optionList li { padding: 8px 10px; cursor: pointer; }
  #optionList li:hover { background: #eef; }
</style></head><body>
<h1>Custom Dropdown</h1>
<div id="dropdown">
  <button id="dropdownBtn">Select a language ▾</button>
  <ul id="optionList">
    <li>JavaScript</li><li>Python</li><li>Java</li><li>C++</li>
  </ul>
</div>
<script src="q8.js"></script></body></html>
