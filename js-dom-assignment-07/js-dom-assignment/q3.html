<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Q3 Multi-Step Form</title>
<link rel="stylesheet" href="base.css">
<style>
  .step { display: none; }
  .step.active { display: block; }
  .step input { width: 100%; }
  #summary { display: none; background: #f0f8f0; padding: 12px; border-radius: 6px; }
</style></head><body>
<h1>Sign-up (3 steps)</h1>
<div id="formArea">
  <div class="step active"><label>Name<br><input id="nameInput" type="text"></label></div>
  <div class="step"><label>Email<br><input id="emailInput" type="email"></label></div>
  <div class="step"><label>Password (min 6)<br><input id="passwordInput" type="password"></label></div>
  <div class="error" id="errorMsg"></div>
  <button id="backBtn">Back</button> <button id="nextBtn">Next</button>
</div>
<div id="summary"></div>
<script src="q3.js"></script></body></html>
