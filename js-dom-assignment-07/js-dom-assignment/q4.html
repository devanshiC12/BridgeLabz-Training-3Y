<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Q4 Theme Switcher</title>
<link rel="stylesheet" href="base.css">
<style>
  body { transition: background .2s, color .2s; }
  body.theme-light { background: #ffffff; color: #222; }
  body.theme-dark  { background: #1e1e1e; color: #f1f1f1; }
  body.theme-blue  { background: #dbeafe; color: #1e3a8a; }
</style></head><body class="theme-light" data-theme="light">
<h1>Theme Switcher</h1>
<p>Current theme: <strong id="themeLabel">light</strong></p>
<button data-theme-btn="light">Light</button>
<button data-theme-btn="dark">Dark</button>
<button data-theme-btn="blue">Blue</button>
<script src="q4.js"></script></body></html>
