<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Q7 Mouse Logger</title>
<link rel="stylesheet" href="base.css">
<style>
  #box { position: relative; width: 400px; height: 400px; border: 2px solid #333; background: #fafafa; overflow: hidden; }
  .dot { position: absolute; width: 10px; height: 10px; background: red; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
</style></head><body>
<h1>Mouse Coordinates Logger</h1>
<p id="coords">Move the mouse inside the box</p>
<div id="box"></div>
<p>Double-click inside the box to drop a red dot.</p>
<script src="q7.js"></script></body></html>
