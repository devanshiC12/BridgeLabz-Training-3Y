<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Q5 Image Gallery</title>
<link rel="stylesheet" href="base.css">
<style>
  body { max-width: 640px; }
  #gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  #gallery img { width: 100%; height: 120px; object-fit: cover; cursor: pointer; border-radius: 6px; }
  #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); align-items: center; justify-content: center; }
  #modal.open { display: flex; }
  #modalContent { background: #fff; padding: 10px; border-radius: 8px; max-width: 90vw; }
  #modalImage { max-width: 100%; max-height: 80vh; display: block; }
</style></head><body>
<h1>Image Gallery</h1>
<div id="gallery"></div>
<div id="modal"><div id="modalContent"><img id="modalImage" alt="Large preview"></div></div>
<script src="q5.js"></script></body></html>
