<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Q2 Character Counter</title>
<link rel="stylesheet" href="base.css">
<style>
  textarea { width: 100%; height: 120px; }
  #counter { font-weight: 600; color: green; margin: 6px 0; }
  #counter.warning { color: #d4a000; }  /* yellow-ish, readable on white */
  #counter.danger  { color: red; }
</style></head><body>
<h1>Live Character Counter</h1>
<textarea id="textBox" placeholder="Type here (max 100 characters)"></textarea>
<div id="counter">100 characters left</div>
<button id="resetBtn">Reset</button>
<script src="q2.js"></script></body></html>
